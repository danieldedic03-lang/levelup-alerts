<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:'Montserrat',sans-serif}
  .stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:out .6s ease-in 6.5s forwards}
  .flash{position:absolute;inset:0;background:radial-gradient(circle,#fff,#00e5ff55 40%,transparent 70%);opacity:0;animation:flash .5s ease-out .2s}
  .infinity{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:Arial,sans-serif;font-size:520px;line-height:1;
    color:#b44cff;text-shadow:0 0 20px #00e5ff,0 0 40px #b44cff,0 0 80px #ff3cc7;opacity:0;
    animation:infIn 1s .3s forwards,infPulse 3s 1.3s ease-in-out infinite}
  .bolt{position:absolute;width:140px;opacity:0;filter:drop-shadow(0 0 12px #00e5ff) drop-shadow(0 0 24px #ff3cc7)}
  .b1{left:12%;top:20%;animation:zap 1.2s .1s 2}
  .b2{right:12%;top:25%;transform:scaleX(-1);animation:zap 1.2s .4s 2}
  .frame{position:absolute;width:760px;height:380px;border:4px solid #b44cff;border-radius:24px;opacity:0;
    box-shadow:0 0 20px #1e6bff,0 0 40px #ff3cc7,inset 0 0 20px #1e6bff;animation:pop .5s .5s forwards,pulse 1s 1s infinite alternate}
  .tag,.name,.sub{position:relative;z-index:2}
  .tag{font-size:42px;letter-spacing:6px;color:#00e5ff;text-shadow:0 0 10px #00e5ff,0 0 30px #1e6bff;opacity:0;animation:drop .5s .6s forwards}
  .name{font-size:120px;line-height:1.1;background:linear-gradient(180deg,#fff 0%,#00e5ff 35%,#b44cff 60%,#ff3cc7 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2px #1a0b3d;
    filter:drop-shadow(0 0 12px #ff3cc7) drop-shadow(0 0 24px #1e6bff);opacity:0;transform:scale(3);animation:slam .45s .9s cubic-bezier(.2,1.6,.4,1) forwards}
  .sub{font-size:28px;letter-spacing:4px;color:#ff3cc7;text-shadow:0 0 10px #ff3cc7;opacity:0;animation:drop .5s 1.3s forwards}
  .spark{position:absolute;width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 10px 3px var(--c);opacity:0;animation:burst 1.4s var(--d) ease-out forwards}
  @keyframes flash{0%{opacity:1}100%{opacity:0}}
  @keyframes infIn{to{opacity:.45}}
  @keyframes infPulse{0%,100%{opacity:.45;transform:translate(-50%,-50%) scale(1)}50%{opacity:.7;transform:translate(-50%,-50%) scale(1.08)}}
  @keyframes zap{0%,100%{opacity:0}10%,30%{opacity:1}20%{opacity:.2}}
  @keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
  @keyframes pulse{to{box-shadow:0 0 35px #00e5ff,0 0 70px #ff3cc7,inset 0 0 30px #b44cff}}
  @keyframes drop{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:none}}
  @keyframes slam{to{opacity:1;transform:scale(1)}}
  @keyframes burst{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--x),var(--y))}}
  @keyframes out{to{opacity:0;transform:scale(1.1)}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="flash"></div>
  <div class="infinity">∞</div>
  <svg class="bolt b1" viewBox="0 0 64 128"><polygon points="38,0 8,70 30,70 20,128 58,48 34,48 48,0" fill="#e8fbff"/></svg>
  <svg class="bolt b2" viewBox="0 0 64 128"><polygon points="38,0 8,70 30,70 20,128 58,48 34,48 48,0" fill="#ffe3f6"/></svg>
  <div class="frame"></div>
  <div class="tag">⚡ LEVEL 50 LEGEND ⚡</div>
  <div class="name" id="name">DANCH</div>
  <div class="sub">THANK YOU FOR THE SUPPORT · TYES CLIPS</div>
</div>
<script>
  const n = new URLSearchParams(location.search).get('name');
  if (n) document.getElementById('name').textContent = n.toUpperCase();
  const cols = ['#00e5ff','#1e6bff','#b44cff','#ff3cc7'], s = document.getElementById('stage');
  for (let i = 0; i < 40; i++) {
    const d = document.createElement('div'), a = Math.random()*Math.PI*2, r = 250 + Math.random()*300;
    d.className = 'spark';
    d.style.setProperty('--x', Math.cos(a)*r + 'px');
    d.style.setProperty('--y', Math.sin(a)*r + 'px');
    d.style.setProperty('--c', cols[i % 4]);
    d.style.setProperty('--d', (0.9 + Math.random()*0.4) + 's');
    s.appendChild(d);
  }
</script>
</body>
</html>
