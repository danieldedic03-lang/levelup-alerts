<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:'Montserrat',sans-serif}
  .stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:out .6s ease-in 6s forwards}
  .flash{position:absolute;inset:0;background:radial-gradient(circle,#fff,#00e5ff55 40%,transparent 70%);opacity:0;animation:flash .5s ease-out .2s}
  .infinity{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:Arial,sans-serif;font-size:750px;line-height:1;
    color:#b44cff;text-shadow:0 0 20px #00e5ff,0 0 40px #b44cff,0 0 80px #ff3cc7;opacity:0;
    animation:infIn 1s .3s forwards,infPulse 3s 1.3s ease-in-out infinite}
  .bolt{position:absolute;width:140px;opacity:0;filter:drop-shadow(0 0 12px #00e5ff) drop-shadow(0 0 24px #ff3cc7)}
  .b1{left:12%;top:20%;animation:zap 1.2s .1s 2}
  .b2{right:12%;top:25%;transform:scaleX(-1);animation:zap 1.2s .4s 2}
  .arrows{position:absolute;bottom:-20%;display:flex;gap:80px;z-index:1}
  .arrows span{font-size:90px;color:#00e5ff;text-shadow:0 0 15px #00e5ff,0 0 30px #ff3cc7;opacity:0;animation:rise 2s ease-out infinite}
  .arrows span:nth-child(2){animation-delay:.4s;color:#ff3cc7}
  .arrows span:nth-child(3){animation-delay:.8s;color:#b44cff}
  .main{position:relative;z-index:2;font-size:150px;line-height:1.1;
    background:linear-gradient(180deg,#fff 0%,#00e5ff 35%,#b44cff 60%,#ff3cc7 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2px #1a0b3d;
    filter:drop-shadow(0 0 12px #ff3cc7) drop-shadow(0 0 24px #1e6bff);
    opacity:0;transform:translateY(200px);animation:up .6s .7s cubic-bezier(.2,1.6,.4,1) forwards}
  .spark{position:absolute;width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 10px 3px var(--c);opacity:0;animation:burst 1.4s var(--d) ease-out forwards}
  @keyframes flash{0%{opacity:1}100%{opacity:0}}
  @keyframes infIn{to{opacity:.45}}
  @keyframes infPulse{0%,100%{opacity:.45;transform:translate(-50%,-50%) scale(1)}50%{opacity:.7;transform:translate(-50%,-50%) scale(1.08)}}
  @keyframes zap{0%,100%{opacity:0}10%,30%{opacity:1}20%{opacity:.2}}
  @keyframes rise{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(-500px)}}
  @keyframes up{to{opacity:1;transform:translateY(0)}}
  @keyframes burst{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--x),var(--y))}}
  @keyframes out{to{opacity:0;transform:scale(1.1)}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="flash"></div>
  <div class="infinity">∞</div>
  <svg class="bolt b1" viewBox="0 0 64 128"><polygon points="38,0 8,70 30,70 20,128 58,48 34,48 48,0" fill="#e8fbff"/></svg>
  <svg class="bolt b2" viewBox="0 0 64 128"><polygon points="38,0 8,70 30,70 20,128 58,48 34,48 48,0" fill="#ffe3f6"/></svg>
  <div class="arrows"><span>▲</span><span>▲</span><span>▲</span></div>
  <div class="main">LEVEL UP!</div>
</div>
<script>
  const cols=['#00e5ff','#1e6bff','#b44cff','#ff3cc7'],s=document.getElementById('stage');
  for(let i=0;i<40;i++){const d=document.createElement('div'),a=Math.random()*Math.PI*2,r=250+Math.random()*300;
    d.className='spark';d.style.setProperty('--x',Math.cos(a)*r+'px');d.style.setProperty('--y',Math.sin(a)*r+'px');
    d.style.setProperty('--c',cols[i%4]);d.style.setProperty('--d',(0.9+Math.random()*0.4)+'s');s.appendChild(d);}
</script>
</body>
</html>
